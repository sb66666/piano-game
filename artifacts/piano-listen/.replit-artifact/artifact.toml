kind = "web"
previewPath = "/"
title = "學習鋼琴模擬器"
description = "為鋼琴初學者準備的瀏覽器練習工具，提供即時音高聆聽與互動學習入口。"
version = "1.0.0"
id = "artifacts/piano-listen"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21381

[services.development]
run = "pnpm --filter @workspace/piano-listen run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/piano-listen", "run", "build" ]
serve = "static"
publicDir = "artifacts/piano-listen/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21381"
BASE_PATH = "/"
